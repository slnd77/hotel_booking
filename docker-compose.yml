# Vasuttam PMS with MySQL: web (http://localhost:8080), scheduler and queue worker.
#
#   cp .env.example .env            # then set APP_KEY (see README.md)
#   docker compose up -d --build

x-app: &app
    build: .
    image: vasuttam-pms
    env_file: .env
    environment:
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: ${DB_DATABASE:-hotel_booking}
        DB_USERNAME: ${DB_USERNAME:-hotel_booking}
        DB_PASSWORD: ${DB_PASSWORD:-hotel_booking}
        QUEUE_CONNECTION: database
        CACHE_STORE: database
        SESSION_DRIVER: database
    volumes:
        - storage:/var/www/html/storage/app
    depends_on:
        mysql:
            condition: service_healthy
    restart: unless-stopped

services:
    app:
        <<: *app
        ports:
            - '${APP_PORT:-8080}:80'
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-hotel_booking}
            DB_USERNAME: ${DB_USERNAME:-hotel_booking}
            DB_PASSWORD: ${DB_PASSWORD:-hotel_booking}
            QUEUE_CONNECTION: database
            CACHE_STORE: database
            SESSION_DRIVER: database
            RUN_MIGRATIONS: 'true'

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']

    queue:
        <<: *app
        command:
            ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-hotel_booking}
            MYSQL_USER: ${DB_USERNAME:-hotel_booking}
            MYSQL_PASSWORD: ${DB_PASSWORD:-hotel_booking}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
            interval: 5s
            retries: 20
        restart: unless-stopped

volumes:
    mysql:
    storage:
