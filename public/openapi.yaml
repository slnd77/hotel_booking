                                    }
            responses:
                '200': { $ref: '#/components/responses/Message' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/kots/{outletKot}/print:
        get:
            tags: [POS]
            operationId: theKitchenTicketPrintout
            summary: The kitchen ticket printout
            x-scope: pos:read
            parameters:
                - $ref: '#/components/parameters/property'
                - $ref: '#/components/parameters/outletKot'
                - $ref: '#/components/parameters/printFormat'
                - $ref: '#/components/parameters/paper'
            responses:
                '200': { $ref: '#/components/responses/Printout' }
                '404': { $ref: '#/components/responses/NotFound' }
        post:
            tags: [POS]
            operationId: printTheKitchenTicketOnTheKitchenPrinter
            summary: Print the kitchen ticket on the kitchen printer
            x-scope: pos:write
            parameters:
                - $ref: '#/components/parameters/property'
                - $ref: '#/components/parameters/outletKot'
            responses:
                '200': { $ref: '#/components/responses/Message' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/pos/summary:
        get:
            tags: [POS]
            operationId: posSales
            summary: POS sales
            description: Sales over a range of business dates (92 days at most). Defaults to today.
            x-scope: pos:read
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: from,
                      in: query,
                      schema: { type: string, format: date },
                  }
                - {
                      name: to,
                      in: query,
                      schema: { type: string, format: date },
                  }
                - { name: outlet_id, in: query, schema: { type: integer } }
            responses:
                '200':
                    description: The summary.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { type: object }
                '422': { $ref: '#/components/responses/ValidationError' }

components:
    securitySchemes:
        apiKey:
            type: http
            scheme: bearer
            description: An API key from Profile → Developer, or a device token from `/auth/login`.

    parameters:
        property:
            {
                name: property,
                in: path,
                required: true,
                schema: { type: integer },
                description: "The property's ID (from `/properties`).",
            }
        booking:
            {
                name: booking,
                in: path,
                required: true,
                schema: { type: integer },
            }
        guest:
            { name: guest, in: path, required: true, schema: { type: integer } }
        payment:
            {
                name: payment,
                in: path,
                required: true,
                schema: { type: integer },
            }
        outlet:
            {
                name: outlet,
                in: path,
                required: true,
                schema: { type: integer },
            }
        outletBill:
            {
                name: outletBill,
                in: path,
                required: true,
                schema: { type: integer },
            }
        outletKot:
            {
                name: outletKot,
                in: path,
                required: true,
                schema: { type: integer },
            }
        updated_since:
            {
                name: updated_since,
                in: query,
                schema: { type: string, format: date-time },
                description: 'Only records changed at or after this instant.',
            }
        page:
            {
                name: page,
                in: query,
                schema: { type: integer, minimum: 1, default: 1 },
            }
        per_page:
            {
                name: per_page,
                in: query,
                schema:
                    { type: integer, minimum: 1, maximum: 100, default: 25 },
            }
        printFormat:
            {
                name: format,
                in: query,
                schema: { type: string, enum: [escpos] },
                description: 'ESC/POS bytes instead of HTML.',
            }
        paper:
            {
                name: paper,
                in: query,
                schema: { type: string, enum: [a4, thermal_80, thermal_58] },
            }

    responses:
        Message:
            description: Done.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Message' }
        Moved:
            description: Moved.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            moved: { type: boolean }
                            price:
                                {
                                    description: 'The new rate, when the move changes it.',
                                }
        DeviceToken:
            description: Signed in.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/DeviceToken' }
        BookingChannel:
            description: The channel.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message: { type: string }
                            channel:
                                { $ref: '#/components/schemas/BookingChannel' }
        ChartNotes:
            description: The day's notes.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            notes:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        id: { type: integer }
                                        user_id: { type: integer }
                                        user_name: { type: string }
                                        body: { type: string }
                                        updated_at:
                                            {
                                                type: [string, 'null'],
                                                format: date-time,
                                            }
        BookingPage:
            description: A page of bookings.
            content:
                application/json:
                    schema:
                        allOf:
                            - $ref: '#/components/schemas/Page'
                            - type: object
                              properties:
                                  data:
                                      {
                                          type: array,
                                          items:
                                              {
                                                  $ref: '#/components/schemas/Booking',
                                              },
                                      }
        BookingSaved:
            description: Saved.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message: { type: string }
                            booking:
                                type: object
                                properties:
                                    id: { type: integer }
                                    booking_ref_id: { type: string }
                                    status:
                                        {
                                            $ref: '#/components/schemas/BookingStatus',
                                        }
        Guest:
            description: The guest.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data: { $ref: '#/components/schemas/Guest' }
        Payment:
            description: The payment.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data: { $ref: '#/components/schemas/Payment' }
        OutletBill:
            description: The bill.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            data: { $ref: '#/components/schemas/OutletBill' }
        Printout:
            description: The printout.
            content:
                text/html:
                    schema: { type: string }
                application/octet-stream:
                    schema: { type: string, format: binary }
        Unauthenticated:
            description: No key, or the key is revoked or expired.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Message' }
        Forbidden:
            description: The key lacks the scope, or the owner's role doesn't allow the action.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Message' }
        NotFound:
            description: Not found, or not in this property.
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/Message' }
        ValidationError:
            description: The request isn't valid.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            message: { type: string }
                            errors:
                                type: object
                                additionalProperties:
                                    { type: array, items: { type: string } }
        TooManyRequests:
            description: Over the rate limit. Retry after `Retry-After` seconds.

    schemas:
        Message:
            type: object
            properties:
                message: { type: string }

        Option:
            type: object
            properties:
                value: { type: string }
                label: { type: string }

        Page:
            type: object
            description: Laravel pagination.
            properties:
                links:
                    type: object
                    properties:
                        first: { type: [string, 'null'] }
                        last: { type: [string, 'null'] }
                        prev: { type: [string, 'null'] }
                        next: { type: [string, 'null'] }
                meta:
                    type: object
                    properties:
                        current_page: { type: integer }
                        from: { type: [integer, 'null'] }
                        last_page: { type: integer }
                        per_page: { type: integer }
                        to: { type: [integer, 'null'] }
                        total: { type: integer }

        DeviceToken:
            type: object
            properties:
                token: { type: string }
                token_type: { type: string, enum: [Bearer] }
                user: { $ref: '#/components/schemas/Me' }

        TwoFactorChallenge:
            type: object
            properties:
                two_factor: { type: boolean, enum: [true] }
                challenge_token: { type: string }
                expires_in: { type: integer, description: 'Seconds.' }
                methods:
                    type: array
                    items:
                        type: object
                        properties:
                            value:
                                {
                                    type: string,
                                    enum: [passkey, totp, whatsapp, sms, email],
                                }
                            label: { type: string }
                            destination:
                                {
                                    type: [string, 'null'],
                                    description: 'Where a code is sent, masked.',
                                }

        Me:
            type: object
            properties:
                id: { type: integer }
                name: { type: string }
                email: { type: string }
                mobile_country_code: { type: [string, 'null'] }
                mobile: { type: [string, 'null'] }
                roles: { type: array, items: { type: string } }
                permissions:
                    {
                        type: array,
                        items: { type: string },
                        description: '`["*"]` for full-access roles.',
                    }
                scopes:
                    {
                        type: array,
                        items: { type: string },
                        description: 'What this token may use now.',
                    }
                two_factor_methods: { type: array, items: { type: string } }
                plan_features:
                    {
                        type: [array, 'null'],
                        items: { type: string },
                        description: "The plan's features; null means everything.",
                    }
                package_menus: { type: object }

        Property:
            type: object
            properties:
                id: { type: integer }
                name: { type: string }
                abbreviation: { type: [string, 'null'] }
                timezone: { type: string, description: 'IANA timezone.' }
                today:
                    {
                        type: string,
                        format: date,
                        description: "The property's business date.",
                    }

        BookingChannel:
            type: object
            properties:
                id: { type: integer }
                name: { type: string }
                is_active: { type: boolean }
                bookings_count: { type: integer }

        Chart:
            type: object
            properties:
                property_id: { type: integer }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                today: { type: string, format: date }
                can_go_prev: { type: boolean }
                dates:
                    {
                        type: array,
                        items: { type: object },
                        description: 'Each day with holidays, enquiry counts and notes.',
                    }
                daily_totals: { type: object }
                categories:
                    {
                        type: array,
                        items: { type: object },
                        description: "Categories with availability and their rooms' stays and blocks.",
                    }
                block_reasons: { type: array, items: { type: object } }
                housekeeping_statuses: { type: array, items: { type: object } }

        RoomRange:
            type: object
            required: [start_date, end_date, room_ids]
            properties:
                start_date: { type: string, format: date }
                end_date:
                    {
                        type: string,
                        format: date,
                        description: 'After start_date.',
                    }
                room_ids: { type: array, minItems: 1, items: { type: integer } }

        BookingStatus:
            type: string
            enum:
                [
                    confirmed,
                    on_hold,
                    checked_in,
                    checked_out,
                    cancelled,
                    no_show,
                    pending,
                    enquiry,
                    expired_quote,
                ]

        Booking:
            type: object
            properties:
                id: { type: integer }
                property_id: { type: integer }
                booking_ref_id: { type: string }
                status: { $ref: '#/components/schemas/BookingStatus' }
                status_label: { type: string }
                source: { type: string }
                booking_channel_id: { type: [integer, 'null'] }
                agent_id: { type: [integer, 'null'] }
                type: { type: string }
                booking_type: { type: [string, 'null'] }
                check_in: { type: string, format: date }
                check_out: { type: string, format: date }
                check_in_time: { type: [string, 'null'] }
                check_out_time: { type: [string, 'null'] }
                rate_plan: { type: [string, 'null'] }
                pay_at_hotel: { type: boolean }
                room_total: { type: number }
                discount: { type: number }
                taxes: { type: number }
                total: { type: number }
                outstanding: { type: number }
                special_instructions: { type: [string, 'null'] }
                internal_notes: { type: [string, 'null'] }
                hold_release_at: { type: [string, 'null'], format: date-time }
                created_at: { type: string, format: date-time }
                updated_at: { type: string, format: date-time }
                guests:
                    {
                        type: array,
                        items: { $ref: '#/components/schemas/Guest' },
                    }
                rooms:
                    type: array
                    items:
                        type: object
                        properties:
                            id: { type: integer }
                            room_category_id: { type: integer }
                            room_category: { type: [string, 'null'] }
                            room_id: { type: [integer, 'null'] }
                            room: { type: [string, 'null'] }
                            meal_plan: { type: [string, 'null'] }
                            adults: { type: integer }
                            children: { type: integer }
                            infants: { type: integer }
                            rate_per_night: { type: number }
                            check_in_date: { type: string, format: date }
                            check_out_date: { type: string, format: date }
                            status: { type: string }
                payments:
                    {
                        type: array,
                        items: { $ref: '#/components/schemas/Payment' },
                        description: 'On a single booking only.',
                    }

        BookingForm:
            type: object
            required:
                [
                    source,
                    type,
                    check_in,
                    check_out,
                    status,
                    room_bill_to,
                    extras_bill_to,
                    rooms,
                ]
            properties:
                booking_ref_id:
                    {
                        type: string,
                        maxLength: 255,
                        description: 'Generated when left out.',
                    }
                source:
                    {
                        type: string,
                        description: 'direct, corporate, ota, travel_agent, meta, …',
                    }
                agent_id:
                    {
                        type: integer,
                        description: 'Required when source is travel_agent.',
                    }
                booking_channel_id:
                    {
                        type: integer,
                        description: 'Required when source is ota (from `/booking-channels`).',
                    }
                metasearch_platform_id:
                    {
                        type: integer,
                        description: 'Required when source is meta.',
                    }
                type:
                    {
                        type: string,
                        description: 'A booking type from `/bookings/options`.',
                    }
                booking_type: { type: string }
                check_in: { type: string, format: date }
                check_out: { type: string, format: date }
                check_in_time: { type: string, maxLength: 20 }
                check_out_time: { type: string, maxLength: 20 }
                status: { type: string, enum: [confirmed, on_hold, enquiry] }
                hold_release_at:
                    {
                        type: string,
                        format: date-time,
                        description: 'Required for on_hold and enquiry.',
                    }
                hold_auto_release: { type: boolean }
                hold_reminders:
                    type: array
                    maxItems: 10
                    items:
                        type: object
                        required: [channel, days, relative_to]
                        properties:
                            channel: { type: string }
                            days: { type: integer, minimum: 0, maximum: 365 }
                            relative_to:
                                {
                                    type: string,
                                    enum: [hold_release_date, check_in_date],
                                }
                same_plan_for_all_rooms: { type: boolean }
                pay_at_hotel: { type: boolean }
                rate_plan: { type: string }
                discount: { type: number, minimum: 0 }
                room_bill_to: { type: string, enum: [to_guest, to_company] }
                extras_bill_to: { type: string, enum: [to_guest, to_company] }
                bill_room_to_guest_company: { type: boolean }
                bill_extras_to_guest_company: { type: boolean }
                no_post: { type: boolean }
                inclusions: { type: array, items: { type: string } }
                special_instructions: { type: string }
                internal_notes: { type: string }
                copy_to:
                    type: array
                    items:
                        type: object
                        required: [name]
                        properties:
                            name: { type: string }
                            phone_country_code: { type: string }
                            phone: { type: string }
                            email: { type: string, format: email }
                guest_ids:
                    {
                        type: array,
                        items: { type: integer },
                        description: 'The first is the primary guest.',
                    }
                rooms:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        required: [room_category_id, adults]
                        properties:
                            room_category_id: { type: integer }
                            room_id:
                                {
                                    type: [integer, 'null'],
                                    description: 'Null leaves the room unassigned.',
                                }
                            meal_plan: { type: string }
                            package_id: { type: integer }
                            adults: { type: integer, minimum: 1 }
                            children: { type: integer, minimum: 0 }
                            infants: { type: integer, minimum: 0 }
                            rate_per_night: { type: number, minimum: 0 }
                addons:
                    type: array
                    maxItems: 50
                    items:
                        type: object
                        required: [addon_id, quantity]
                        properties:
                            addon_id: { type: integer }
                            quantity:
                                { type: integer, minimum: 1, maximum: 999 }
                override_restrictions:
                    {
                        type: boolean,
                        description: 'Book although stay restrictions rule the stay out (needs the permission).',
                    }

        Guest:
            type: object
            properties:
                id: { type: integer }
                property_id: { type: integer }
                tracker_number: { type: [string, 'null'] }
                title: { type: [string, 'null'] }
                first_name: { type: string }
                last_name: { type: [string, 'null'] }
                phone_country_code: { type: [string, 'null'] }
                phone: { type: [string, 'null'] }
                emails: { type: array, items: { type: string } }
                gender: { type: [string, 'null'] }
                dob: { type: [string, 'null'], format: date }
                nationality: { type: [string, 'null'] }
                purpose_of_visit: { type: [string, 'null'] }
                guest_preferences: { type: [string, 'null'] }
                anniversary: { type: [string, 'null'], format: date }
                company: { type: [object, 'null'] }
                address: { type: [object, 'null'] }
                vehicle_number: { type: [string, 'null'] }
                created_at: { type: string, format: date-time }
                updated_at: { type: string, format: date-time }

        GuestForm:
            type: object
            required: [first_name]
            description: Last name and phone may also be required (Application Settings → Guest).
            properties:
                title: { type: string, maxLength: 20 }
                first_name: { type: string, maxLength: 255 }
                last_name: { type: string, maxLength: 255 }
                phone_country_code: { type: string, maxLength: 10 }
                phone: { type: string, maxLength: 20 }
                emails: { type: array, items: { type: string, format: email } }
                gender: { type: string, maxLength: 20 }
                dob: { type: string, format: date }
                nationality: { type: string, maxLength: 100 }
                purpose_of_visit: { type: string, enum: [Leisure, Business] }
                guest_preferences: { type: string }
                subscribe_newsletter: { type: boolean }
                anniversary: { type: string, format: date }
                frequent_flyer: { type: string, maxLength: 255 }
                vehicle_number: { type: string, maxLength: 50 }
                place_of_birth: { type: string, maxLength: 255 }
                present_business_address: { type: string, maxLength: 255 }
                address:
                    type: object
                    properties:
                        address: { type: string }
                        country_id: { type: integer }
                        state_id: { type: integer }
                        city_id: { type: integer }
                        postal_code: { type: string }
                company:
                    type: object
                    properties:
                        gstin: { type: string }
                        name: { type: string }
                        email: { type: string, format: email }
                        integration_id: { type: string }
                        address: { type: string }
                city_ledger_account_id:
                    {
                        type: integer,
                        description: "The company's City Ledger account.",
                    }
                create_city_ledger_account: { type: boolean }
                international_details:
                    type: object
                    properties:
                        passport_number: { type: string }
                        passport_issue_date: { type: string, format: date }
                        passport_issue_place: { type: string }

        PaymentMode:
            type: string
            enum:
                [
                    Online,
                    Cash,
                    Credit Card,
                    Debit Card,
                    E-Collect,
                    Net Banking,
                    NEFT,
                    RTGS,
                    IMPS,
                    UPI,
                    Cheque/DD,
                    Payment Wallet,
                    USSD,
                    Others,
                    Debit Note,
                    Credit Note,
                    Bills Payment,
                    Gift Card,
                    Commission,
                    TDS,
                    Air Pay,
                    Bank Transfer,
                    AUB Paymate,
                    QR Code,
                    Bank Deposit,
                ]

        PaymentStatus:
            type: string
            enum: [Received, Pending, Cancelled, Refunded, Failed]

        Payment:
            type: object
            properties:
                id: { type: integer }
                property_id: { type: integer }
                booking_id: { type: [integer, 'null'] }
                type: { type: string, enum: [receipt, refund] }
                receipt_number: { type: string }
                voucher_number: { type: [string, 'null'] }
                status: { $ref: '#/components/schemas/PaymentStatus' }
                payment_mode: { $ref: '#/components/schemas/PaymentMode' }
                total_txn_amount: { type: number }
                tagged_amount: { type: number }
                untagged_amount: { type: number }
                guest_name: { type: [string, 'null'] }
                payee_name: { type: [string, 'null'] }
                payment_ref_id: { type: [string, 'null'] }
                pg_txn_id: { type: [string, 'null'] }
                collection_source: { type: [string, 'null'] }
                collected_by_staff: { type: [string, 'null'] }
                notes: { type: [string, 'null'] }
                cancellation_reason: { type: [string, 'null'] }
                payment_transaction_date:
                    { type: [string, 'null'], format: date-time }
                created_at: { type: string, format: date-time }
                allocations:
                    type: array
                    items:
                        type: object
                        properties:
                            booking_id: { type: integer }
                            booking_ref_id: { type: string }
                            tagged_amount: { type: number }

        BillItems:
            type: object
            properties:
                items:
                    type: array
                    maxItems: 200
                    items:
                        type: object
                        required: [outlet_item_id, quantity]
                        properties:
                            outlet_item_id: { type: integer }
                            quantity:
                                { type: integer, minimum: 1, maximum: 9999 }
                            unit_price:
                                {
                                    type: number,
                                    minimum: 0,
                                    description: 'Overrides the price (needs the permission).',
                                }
                discount: { type: number, minimum: 0 }

        OutletBill:
            type: object
            properties:
                id: { type: integer }
                property_id: { type: integer }
                outlet_id: { type: integer }
                outlet: { type: string }
                bill_number: { type: string }
                business_date: { type: string, format: date }
                status: { type: string, enum: [open, posted, settled, void] }
                status_label: { type: string }
                guest_name: { type: [string, 'null'] }
                table_number: { type: [string, 'null'] }
                outlet_table_id: { type: [integer, 'null'] }
                split_from_id: { type: [integer, 'null'] }
                booking_id: { type: [integer, 'null'] }
                booking_ref_id: { type: [string, 'null'] }
                sub_booking_id: { type: [integer, 'null'] }
                sub_folio_id: { type: [integer, 'null'] }
                payment_id: { type: [integer, 'null'] }
                receipt_number: { type: [string, 'null'] }
                sub_total: { type: number }
                discount: { type: number }
                tax_total: { type: number }
                total: { type: number }
                notes: { type: [string, 'null'] }
                items:
                    type: array
                    items:
                        type: object
                        properties:
                            id: { type: integer }
