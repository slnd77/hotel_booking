openapi: 3.1.0
info:
    title: Hotel Booking API
    version: 1.0.0
    description: |
        The JSON API for integrations: reservations and enquiries, guests, payments, the smart
        booking chart and POS.

        **Authentication.** Make an API key under Profile → Developer and send it on every request
        as `Authorization: Bearer <key>`, with `Accept: application/json`. Each operation names the scope it needs (`x-scope`). A
        request passes only when the key holds that scope **and** the key's owner is allowed the
        matching action by their role at that moment, so a key never does more than its owner may.

        **Dates and times.** Dates (`check_in`, `from`, `business_date`, …) are the property's
        calendar dates, `YYYY-MM-DD`. Instants (`created_at`, `updated_at`, …) are UTC, ISO 8601.

        **Syncing.** The list endpoints take `updated_since` (an instant) and are paginated
        (`page`, `per_page` up to 100), newest first. Poll them to keep another system in step.

        **Rate limits.** 120 requests a minute per key; sign-in endpoints 10 a minute per e-mail
        address. Over the limit the API answers `429` with a `Retry-After` header.

        **Errors.** `401` no or bad key, `403` missing scope or permission, `404` not found (or not
        in this property), `422` validation (`message` and `errors` by field), `429` rate limit.

        `/api/v1/panel/*` is the staff app's private bridge to the admin panel. Its responses follow
        the web pages and change with them; it is not part of this API.
servers:
    - url: /api/v1
security:
    - apiKey: []
tags:
    - name: Authentication
      description: Signing in a device with e-mail and password (and two-factor). Integrations use an API key instead.
    - name: Account
      description: "The key's user and the account's properties."
    - name: Booking channels
      description: 'The OTAs bookings can come from. Account owners only.'
    - name: Smart chart
      description: 'Availability, stays, blocks, notes and housekeeping, as on the web chart.'
    - name: Bookings
      description: 'Reservations and enquiries: list, read, create, edit, move, check in and out.'
    - name: Guests
      description: 'Guest profiles.'
    - name: Payments
      description: "Receipts and refunds, credited to the bookings' folios."
    - name: POS
      description: 'Outlets, bills, kitchen tickets, printing and sales.'

paths:
    /auth/login:
        post:
            tags: [Authentication]
            operationId: signInADevice
            summary: Sign in a device
            description: Answers a token, or a two-factor challenge when the user has two-factor sign-in turned on.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password, device_name]
                            properties:
                                email: { type: string, format: email }
                                password: { type: string }
                                device_name: { type: string, maxLength: 100 }
            responses:
                '200':
                    description: A device token, or a two-factor challenge.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/DeviceToken'
                                    - $ref: '#/components/schemas/TwoFactorChallenge'
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429': { $ref: '#/components/responses/TooManyRequests' }

    /auth/two-factor/code:
        post:
            tags: [Authentication]
            operationId: sendATwoFactorCode
            summary: Send a two-factor code
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [challenge_token, method]
                            properties:
                                challenge_token: { type: string }
                                method:
                                    {
                                        type: string,
                                        enum: [whatsapp, sms, email],
                                    }
            responses:
                '200': { $ref: '#/components/responses/Message' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /auth/two-factor/code/verify:
        post:
            tags: [Authentication]
            operationId: verifyASentCode
            summary: Verify a sent code
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [challenge_token, method, code]
                            properties:
                                challenge_token: { type: string }
                                method:
                                    {
                                        type: string,
                                        enum: [whatsapp, sms, email],
                                    }
                                code: { type: string, maxLength: 12 }
            responses:
                '200': { $ref: '#/components/responses/DeviceToken' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /auth/two-factor/totp:
        post:
            tags: [Authentication]
            operationId: verifyAnAuthenticatorAppCode
            summary: Verify an authenticator app code
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [challenge_token, code]
                            properties:
                                challenge_token: { type: string }
                                code: { type: string, maxLength: 12 }
            responses:
                '200': { $ref: '#/components/responses/DeviceToken' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /auth/two-factor/recovery:
        post:
            tags: [Authentication]
            operationId: useARecoveryCode
            summary: Use a recovery code
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [challenge_token, recovery_code]
                            properties:
                                challenge_token: { type: string }
                                recovery_code: { type: string, maxLength: 100 }
            responses:
                '200': { $ref: '#/components/responses/DeviceToken' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /auth/two-factor/passkey/options:
        post:
            tags: [Authentication]
            operationId: passkeyRequestOptions
            summary: Passkey request options
            description: WebAuthn request options for the challenge's user.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [challenge_token]
                            properties:
                                challenge_token: { type: string }
            responses:
                '200':
                    description: WebAuthn `PublicKeyCredentialRequestOptions`.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    options: { type: object }
                '422': { $ref: '#/components/responses/ValidationError' }

    /auth/two-factor/passkey:
        post:
            tags: [Authentication]
            operationId: verifyAPasskey
            summary: Verify a passkey
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [challenge_token, credential]
                            properties:
                                challenge_token: { type: string }
                                credential:
                                    type: object
                                    description: The WebAuthn assertion.
                                    required: [id, rawId, type, response]
                                    properties:
                                        id: { type: string }
                                        rawId: { type: string }
                                        type:
                                            { type: string, enum: [public-key] }
                                        response: { type: object }
            responses:
                '200': { $ref: '#/components/responses/DeviceToken' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /auth/logout:
        post:
            tags: [Authentication]
            operationId: revokeTheCurrentToken
            summary: Revoke the current token
            responses:
                '200': { $ref: '#/components/responses/Message' }
                '401': { $ref: '#/components/responses/Unauthenticated' }

    /me:
        get:
            tags: [Account]
            operationId: theKeyUser
            summary: The key's user
            description: Who the key belongs to, their roles and permissions, and the scopes this key may use now.
            x-scope: account:read
            responses:
                '200':
                    description: The user.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { $ref: '#/components/schemas/Me' }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /properties:
        get:
            tags: [Account]
            operationId: listProperties
            summary: List properties
            x-scope: account:read
            responses:
                '200':
                    description: The account's properties, in the account's order.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            {
                                                $ref: '#/components/schemas/Property',
                                            }
                '401': { $ref: '#/components/responses/Unauthenticated' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /booking-channels:
        get:
            tags: [Booking channels]
            operationId: listOtaChannels
            summary: List OTA channels
            description: The OTAs bookings can come from. Account owners only.
            x-scope: channels:manage
            responses:
                '200':
                    description: The channels.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            {
                                                $ref: '#/components/schemas/BookingChannel',
                                            }
                '403': { $ref: '#/components/responses/Forbidden' }
        post:
            tags: [Booking channels]
            operationId: addAnOtaChannel
            summary: Add an OTA channel
            x-scope: channels:manage
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name]
                            properties:
                                name:
                                    {
                                        type: string,
                                        maxLength: 255,
                                        description: 'Unique.',
                                    }
            responses:
                '201': { $ref: '#/components/responses/BookingChannel' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /booking-channels/{bookingChannel}:
        patch:
            tags: [Booking channels]
            operationId: renameOrSwitchAChannelOnOrOff
            summary: Rename or switch a channel on or off
            x-scope: channels:manage
            parameters:
                - {
                      name: bookingChannel,
                      in: path,
                      required: true,
                      schema: { type: integer },
                  }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name: { type: string, maxLength: 255 }
                                is_active: { type: boolean }
            responses:
                '200': { $ref: '#/components/responses/BookingChannel' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/chart:
        get:
            tags: [Smart chart]
            operationId: theSmartBookingChart
            summary: The smart booking chart
            description: The days (with holidays, enquiry counts and notes), availability per room category, and each room's stays, blocks and housekeeping status.
            x-scope: chart:read
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: start_date,
                      in: query,
                      schema: { type: string, format: date },
                      description: "First day shown. Defaults to the property's today.",
                  }
            responses:
                '200':
                    description: The chart.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Chart' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /properties/{property}/chart-notes:
        post:
            tags: [Smart chart]
            operationId: addANoteToADay
            summary: Add a note to a day
            x-scope: chart:notes
            parameters:
                - $ref: '#/components/parameters/property'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [date, body]
                            properties:
                                date: { type: string, format: date }
                                body: { type: string, maxLength: 1000 }
            responses:
                '200': { $ref: '#/components/responses/ChartNotes' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/chart-notes/{chartNote}:
        put:
            tags: [Smart chart]
            operationId: editYourNote
            summary: Edit your note
            x-scope: chart:notes
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: chartNote,
                      in: path,
                      required: true,
                      schema: { type: integer },
                  }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [body]
                            properties:
                                body: { type: string, maxLength: 1000 }
            responses:
                '200': { $ref: '#/components/responses/ChartNotes' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/rooms/{room}/housekeeping:
        patch:
            tags: [Smart chart]
            operationId: setARoomHousekeepingStatus
            summary: Set a room's housekeeping status
            x-scope: chart:housekeeping
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: room,
                      in: path,
                      required: true,
                      schema: { type: integer },
                  }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [status]
                            properties:
                                status:
                                    {
                                        type: string,
                                        maxLength: 64,
                                        description: "One of the chart's `housekeeping_statuses`, such as Clean or Dirty.",
                                    }
            responses:
                '200':
                    description: Saved.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message: { type: string }
                                    housekeeping: { type: object }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/room-blocks:
        post:
            tags: [Smart chart]
            operationId: blockRooms
            summary: Block rooms
            x-scope: chart:blocks
            parameters:
                - $ref: '#/components/parameters/property'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/RoomRange'
                                - type: object
                                  required: [block_reason_id, remarks]
                                  properties:
                                      block_reason_id:
                                          {
                                              type: integer,
                                              description: "From the chart's `block_reasons`.",
                                          }
                                      name: { type: string, maxLength: 255 }
                                      remarks: { type: string, maxLength: 2000 }
            responses:
                '201':
                    description: Blocked.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    blocked:
                                        {
                                            type: integer,
                                            description: 'Rooms blocked.',
                                        }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/room-blocks/unblock:
        post:
            tags: [Smart chart]
            operationId: unblockRoomsOverARange
            summary: Unblock rooms over a range
            x-scope: chart:blocks
            parameters:
                - $ref: '#/components/parameters/property'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/RoomRange' }
            responses:
                '200':
                    description: Unblocked.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    unblocked:
                                        {
                                            type: integer,
                                            description: 'Rooms unblocked.',
                                        }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/room-blocks/{roomBlock}/move:
        patch:
            tags: [Smart chart]
            operationId: moveABlockToAnotherRoomOrStartDate
            summary: Move a block to another room or start date
            x-scope: chart:blocks
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: roomBlock,
                      in: path,
                      required: true,
                      schema: { type: integer },
                  }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [room_id, start_date]
                            properties:
                                room_id: { type: integer }
                                start_date: { type: string, format: date }
            responses:
                '200': { $ref: '#/components/responses/Moved' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/bookings:
        get:
            tags: [Bookings]
            operationId: listReservations
            summary: List reservations
            description: Reservations, newest first. Enquiries and expired quotes are under `/enquiries`.
            x-scope: bookings:read
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: status,
                      in: query,
                      schema: { type: string },
                      description: 'Comma-separated: confirmed, on_hold, checked_in, checked_out, cancelled, no_show, pending.',
                  }
                - {
                      name: from,
                      in: query,
                      schema: { type: string, format: date },
                      description: 'Stays that end after this date.',
                  }
                - {
                      name: to,
                      in: query,
                      schema: { type: string, format: date },
                      description: 'Stays that start on or before this date.',
                  }
                - $ref: '#/components/parameters/updated_since'
                - {
                      name: q,
                      in: query,
                      schema: { type: string, maxLength: 100 },
                      description: 'Part of the reservation ID.',
                  }
                - $ref: '#/components/parameters/page'
                - $ref: '#/components/parameters/per_page'
            responses:
                '200': { $ref: '#/components/responses/BookingPage' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
        post:
            tags: [Bookings]
            operationId: createABooking
            summary: Create a booking
            description: A confirmed booking, a hold (`on_hold`) or an enquiry. Rates, taxes, restrictions and availability are checked as on the web booking form.
            x-scope: bookings:write
            parameters:
                - $ref: '#/components/parameters/property'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/BookingForm' }
            responses:
                '201': { $ref: '#/components/responses/BookingSaved' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/enquiries:
        get:
            tags: [Bookings]
            operationId: listEnquiries
            summary: List enquiries
            description: Enquiries (quotes), including expired ones. Same filters as `/bookings`; status is enquiry or expired_quote.
            x-scope: bookings:read
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: status,
                      in: query,
                      schema: { type: string },
                      description: 'Comma-separated: enquiry, expired_quote.',
                  }
                - {
                      name: from,
                      in: query,
                      schema: { type: string, format: date },
                  }
                - {
                      name: to,
                      in: query,
                      schema: { type: string, format: date },
                  }
                - $ref: '#/components/parameters/updated_since'
                - {
                      name: q,
                      in: query,
                      schema: { type: string, maxLength: 100 },
                  }
                - $ref: '#/components/parameters/page'
                - $ref: '#/components/parameters/per_page'
            responses:
                '200': { $ref: '#/components/responses/BookingPage' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
        post:
            tags: [Bookings]
            operationId: logAnEnquiry
            summary: Log an enquiry
            description: The booking form's fields; the status is set to enquiry.
            x-scope: bookings:write
            parameters:
                - $ref: '#/components/parameters/property'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/BookingForm' }
            responses:
                '201': { $ref: '#/components/responses/BookingSaved' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/bookings/search:
        get:
            tags: [Bookings]
            operationId: findBookingsByReservationId
            summary: Find bookings by reservation ID
            x-scope: bookings:read
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: q,
                      in: query,
                      required: true,
                      schema: { type: string, maxLength: 100 },
                  }
            responses:
                '200':
                    description: Up to 20 matches.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id: { type: integer }
                                                booking_ref_id: { type: string }
                                                status:
                                                    {
                                                        $ref: '#/components/schemas/BookingStatus',
                                                    }
                                                status_label: { type: string }
                                                check_in:
                                                    {
                                                        type: string,
                                                        format: date,
                                                    }
                                                check_out:
                                                    {
                                                        type: string,
                                                        format: date,
                                                    }
                                                guest:
                                                    { type: [string, 'null'] }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/bookings/options:
        get:
            tags: [Bookings]
            operationId: whatTheBookingFormOffers
            summary: What the booking form offers
            description: Room categories with their rooms and meal plans, booking types, sources, statuses and hold defaults.
            x-scope: bookings:read
            parameters:
                - $ref: '#/components/parameters/property'
            responses:
                '200':
                    description: The options.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    categories:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id: { type: integer }
                                                name: { type: string }
                                                abbreviation:
                                                    { type: [string, 'null'] }
                                                meal_plans:
                                                    {
                                                        type: array,
                                                        items: { type: string },
                                                    }
                                                max_adults: { type: integer }
                                                max_children: { type: integer }
                                                sell_by_bed: { type: boolean }
                                                rooms:
                                                    type: array
                                                    items:
                                                        type: object
                                                        properties:
                                                            id:
                                                                {
                                                                    type: integer,
                                                                }
                                                            name:
                                                                { type: string }
                                    types: { type: array, items: {} }
                                    sources:
                                        {
                                            type: array,
                                            items:
                                                {
                                                    $ref: '#/components/schemas/Option',
                                                },
                                        }
                                    statuses:
                                        {
                                            type: array,
                                            items:
                                                {
                                                    $ref: '#/components/schemas/Option',
                                                },
                                        }
                                    hold_defaults: { type: object }
                '403': { $ref: '#/components/responses/Forbidden' }

    /properties/{property}/bookings/{booking}:
        get:
            tags: [Bookings]
            operationId: readABooking
            summary: Read a booking
            description: One reservation or enquiry with its rooms, guests, receipts and folios.
            x-scope: bookings:read
            parameters:
                - $ref: '#/components/parameters/property'
                - $ref: '#/components/parameters/booking'
            responses:
                '200':
                    description: The booking.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        allOf:
                                            - $ref: '#/components/schemas/Booking'
                                            - type: object
                                              properties:
                                                  folios:
                                                      {
                                                          type: array,
                                                          items:
                                                              { type: object },
                                                          description: 'Folios with their windows and lines.',
                                                      }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [Bookings]
            operationId: editABooking
            summary: Edit a booking
            description: Send the whole booking form. The status must stay the booking's current status (change it with `/status`).
            x-scope: bookings:write
            parameters:
                - $ref: '#/components/parameters/property'
                - $ref: '#/components/parameters/booking'
            requestBody:
                required: true
                content:
                    application/json:
