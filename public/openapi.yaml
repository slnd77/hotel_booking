    /properties/{property}/payments:
        get:
            tags: [Payments]
            operationId: listReceiptsAndRefunds
            summary: List receipts and refunds
            x-scope: payments:read
            parameters:
                - $ref: '#/components/parameters/property'
                - {
                      name: type,
                      in: query,
                      schema: { type: string, enum: [receipt, refund] },
                  }
                - {
                      name: status,
                      in: query,
                      schema: { $ref: '#/components/schemas/PaymentStatus' },
                  }
                - { name: booking_id, in: query, schema: { type: integer } }
                - {
                      name: from,
                      in: query,
                      schema: { type: string, format: date },
                      description: 'Paid on or after this property day.',
                  }
                - {
                      name: to,
                      in: query,
                      schema: { type: string, format: date },
                      description: 'Paid on or before this property day.',
                  }
                - $ref: '#/components/parameters/updated_since'
                - $ref: '#/components/parameters/page'
                - $ref: '#/components/parameters/per_page'
            responses:
                '200':
                    description: A page of payments.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Page'
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  type: array,
                                                  items:
                                                      {
                                                          $ref: '#/components/schemas/Payment',
                                                      },
                                              }
                '403': { $ref: '#/components/responses/Forbidden' }
        post:
            tags: [Payments]
            operationId: recordAReceiptOrRefund
            summary: Record a receipt or refund
            description: |
                Tag it to one booking (`booking_id`, `tagged_amount`) or several (`allocations`), optionally
                naming the folio windows each booking's share settles. Paid in another currency: send
                `currency_code` and `currency_amount`; the server converts at that day's rate.
            x-scope: payments:write
            parameters:
                - $ref: '#/components/parameters/property'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [guest_name, payment_mode]
                            properties:
                                booking_id: { type: [integer, 'null'] }
                                type:
                                    {
                                        type: string,
                                        enum: [receipt, refund],
                                        default: receipt,
                                    }
                                guest_name: { type: string, maxLength: 255 }
                                payment_mode:
                                    { $ref: '#/components/schemas/PaymentMode' }
                                paid_by: { type: string, maxLength: 100 }
                                total_txn_amount:
                                    {
                                        type: number,
                                        minimum: 0.01,
                                        description: 'Required unless currency_code is sent.',
                                    }
                                currency_code:
                                    { type: string, minLength: 3, maxLength: 3 }
                                currency_amount: { type: number, minimum: 0.01 }
                                tagged_amount: { type: number, minimum: 0 }
                                allocations:
                                    type: array
                                    maxItems: 50
                                    items:
                                        type: object
                                        required: [booking_id, tagged_amount]
                                        properties:
                                            booking_id: { type: integer }
                                            tagged_amount:
                                                { type: number, minimum: 0 }
                                            windows:
                                                type: array
                                                maxItems: 50
                                                items:
                                                    type: object
                                                    required:
                                                        [sub_folio_id, amount]
                                                    properties:
                                                        sub_folio_id:
                                                            { type: integer }
                                                        amount:
                                                            {
                                                                type: number,
                                                                minimum: 0,
                                                            }
                                payment_transaction_date:
                                    { type: string, format: date-time }
                                voucher_number: { type: string, maxLength: 255 }
                                payment_ref_id: { type: string, maxLength: 255 }
                                pg_txn_id: { type: string, maxLength: 255 }
                                notes: { type: string, maxLength: 2000 }
                                booking_source: { type: string, maxLength: 100 }
            responses:
                '201': { $ref: '#/components/responses/Payment' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /properties/{property}/payments/{payment}:
        get:
            tags: [Payments]
            operationId: readAPayment
            summary: Read a payment
            x-scope: payments:read
            parameters:
                - $ref: '#/components/parameters/property'
