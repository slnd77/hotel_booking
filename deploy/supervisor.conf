# /etc/supervisor/conf.d/hotel-booking.conf — keeps the queue workers running (queued guest
# e-mails, scheduled reports, channel-manager pushes). After changing it:
#   sudo supervisorctl reread && sudo supervisorctl update
# Each deploy restarts them gracefully with `php artisan queue:restart` (deploy/deploy.sh).

[program:hotel-booking-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hotel-booking/current/artisan queue:work database --sleep=3 --tries=3 --backoff=30 --max-time=3600 --memory=256
directory=/var/www/hotel-booking/current
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/hotel-booking/shared/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
