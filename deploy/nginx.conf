# /etc/nginx/sites-available/hotel-booking — replace pms.example.com and the paths.
# Certificates: sudo certbot --nginx -d pms.example.com (renews by itself).

server {
    listen 80;
    listen [::]:80;
    server_name pms.example.com;

    # Everything over HTTPS (certbot answers its own challenge here).
    location /.well-known/acme-challenge/ { root /var/www/hotel-booking/current/public; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pms.example.com;
    root /var/www/hotel-booking/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/pms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    # ID documents and attachments are uploaded through the app.
    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets carry a hash in their name: cache them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Nothing else in public/ runs as PHP, and dot-files are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
